<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#factGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" rx="16" fill="#070a12"/>
  <circle cx="45" cy="35" r="15" fill="#06b6d4"/>
  <text x="70" y="42" font-family="sans-serif" font-size="18" font-weight="800" fill="#f8fafc">INVOICE FACTORING <tspan fill="#06b6d4">• 10,000 BPS REPAYMENT WATERFALL</tspan></text>
  <rect x="620" y="23" width="140" height="26" rx="6" fill="#1e293b"/>
  <text x="690" y="40" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">INVARIANT PROVEN</text>

  <!-- Flow Visualizer -->
  <g transform="translate(50, 100)">
    <!-- Stage 1: Incoming Repayment -->
    <rect x="0" y="20" width="180" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="90" y="50" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">PURCHASER REPAYMENT</text>
    <text x="90" y="80" font-family="sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">100,000 XLM</text>
    <text x="90" y="105" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">1,000,000,000,000 Stroops</text>

    <!-- Split Arrows -->
    <path d="M190,80 L250,50" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M190,80 L250,110" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- Principal Return (8,000 BPS) -->
    <rect x="260" y="0" width="220" height="75" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="275" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">PRINCIPAL RETURN (8,000 BPS)</text>
    <text x="275" y="50" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">80,000 XLM <tspan font-size="11" fill="#a7f3d0">80.00%</tspan></text>
    <text x="275" y="65" font-family="sans-serif" font-size="10" fill="#6ee7b7">Returned 1:1 to Liquidity Providers</text>

    <!-- Yield Distribution (2,000 BPS) -->
    <rect x="260" y="90" width="220" height="75" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="275" y="115" font-family="sans-serif" font-size="11" font-weight="700" fill="#bae6fd">FACTORING YIELD (2,000 BPS)</text>
    <text x="275" y="140" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">20,000 XLM <tspan font-size="11" fill="#bae6fd">20.00%</tspan></text>
    <text x="275" y="155" font-family="sans-serif" font-size="10" fill="#7dd3fc">Net Return: 10.00% APY Pro-Rata</text>

    <!-- Dust Conservation Guard Box -->
    <rect x="510" y="15" width="190" height="150" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="605" y="45" font-family="sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">DUST CONSERVATION</text>
    <text x="605" y="75" font-family="sans-serif" font-size="28" font-weight="800" fill="#a5b4fc" text-anchor="middle">0 DUST</text>
    <text x="605" y="98" font-family="sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">Principal + Yield = Total</text>
    <text x="605" y="118" font-family="monospace" font-size="10" fill="#818cf8" text-anchor="middle">Remainder to Principal</text>
    <rect x="530" y="130" width="150" height="22" rx="4" fill="#312e81"/>
    <text x="605" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle">Zero-Deficit Enforced</text>
  </g>

  <!-- Bottom Interactive APY Breakdown -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="700" height="130" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Campaign Factoring Economics</text>
    
    <g transform="translate(25, 45)" font-family="sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="15">Campaign Target:</text>
      <text x="140" y="15" fill="#f8fafc" font-weight="600">500,000 XLM</text>
      
      <text x="0" y="40">Disbursement Tranches:</text>
      <text x="140" y="40" fill="#f8fafc" font-weight="600">30% Upfront, 40% Weaving, 30% Delivery</text>

      <text x="350" y="15">Factoring Duration:</text>
      <text x="480" y="15" fill="#f8fafc" font-weight="600">90 Days</text>

      <text x="350" y="40">Collateral Pledged:</text>
      <text x="480" y="40" fill="#34d399" font-weight="600">DPP Twin #PARIS-FW26-001</text>
    </g>

    <rect x="25" y="90" width="650" height="26" rx="6" fill="#111827"/>
    <text x="350" y="107" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">YieldFormula: (Principal × YieldBps × Days) / (10,000 × 365) = Exact Integer Stroops</text>
  </g>
</svg>