name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile WASM Artifacts
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Package Contracts
        run: |
          mkdir -p release-wasm
          cp contracts/target/wasm32-unknown-unknown/release/*.wasm release-wasm/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-wasm/*.wasm
          generate_release_notes: true
