name: Core Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Lint, Typecheck & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter & Typecheck
        run: npm run lint

      - name: Run Backend Tests
        run: npm test

      - name: Build Backend TypeScript
        run: npm run build

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=critical || true

  contract-checks:
    name: Soroban Rust Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cargo Format Check
        run: cargo fmt --check --manifest-path contracts/Cargo.toml || true

      - name: Cargo Check
        run: cargo check --manifest-path contracts/Cargo.toml

      - name: Run Soroban Contract Tests
        run: cargo test --manifest-path contracts/Cargo.toml

      - name: Compile WASM Contracts
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release
