[package]
name = "stellar-threads-fashion-escrow"
version = "0.1.0"
edition = "2021"
description = "Soroban smart contract for B2B fashion production milestone escrow"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
