<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#182033"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#passGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" rx="16" fill="#090d16"/>
  <circle cx="45" cy="35" r="15" fill="#38bdf8"/>
  <text x="70" y="42" font-family="sans-serif" font-size="18" font-weight="800" fill="#f8fafc">STELLAR THREADS <tspan fill="#38bdf8">• DIGITAL PASSPORT</tspan></text>
  <rect x="630" y="23" width="130" height="26" rx="6" fill="#065f46"/>
  <text x="695" y="40" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">VERIFIED ON SOROBAN</text>

  <!-- Left Product Image / QR -->
  <rect x="40" y="100" width="220" height="330" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
  
  <!-- QR Code Mockup -->
  <g transform="translate(65, 125)">
    <rect width="170" height="170" fill="#ffffff" rx="8"/>
    <!-- QR Corner 1 -->
    <rect x="15" y="15" width="40" height="40" fill="#0f172a"/>
    <rect x="23" y="23" width="24" height="24" fill="#ffffff"/>
    <rect x="27" y="27" width="16" height="16" fill="#0f172a"/>
    <!-- QR Corner 2 -->
    <rect x="115" y="15" width="40" height="40" fill="#0f172a"/>
    <rect x="123" y="23" width="24" height="24" fill="#ffffff"/>
    <rect x="127" y="27" width="16" height="16" fill="#0f172a"/>
    <!-- QR Corner 3 -->
    <rect x="15" y="115" width="40" height="40" fill="#0f172a"/>
    <rect x="23" y="123" width="24" height="24" fill="#ffffff"/>
    <rect x="27" y="127" width="16" height="16" fill="#0f172a"/>
    <!-- Random bits -->
    <rect x="70" y="20" width="12" height="20" fill="#0f172a"/>
    <rect x="90" y="45" width="15" height="15" fill="#0f172a"/>
    <rect x="65" y="70" width="40" height="30" fill="#0f172a"/>
    <rect x="70" y="120" width="20" height="15" fill="#0f172a"/>
    <rect x="110" y="100" width="25" height="20" fill="#0f172a"/>
    <rect x="120" y="130" width="25" height="25" fill="#0f172a"/>
  </g>
  <text x="150" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Scan for EU DPP Proof</text>
  <text x="150" y="345" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">SKU: PARIS-FW26-001</text>
  <rect x="60" y="375" width="180" height="34" rx="6" fill="#1e293b"/>
  <text x="150" y="396" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">NFC Chip: MATCHED</text>

  <!-- Right Details -->
  <g transform="translate(290, 100)">
    <text x="0" y="20" font-family="sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Atelier Trenchcoat Model #001</text>
    <text x="0" y="42" font-family="sans-serif" font-size="13" fill="#94a3b8">Designer: <tspan fill="#f8fafc" font-weight="600">Maison de L'Aurore (Haute Couture Tier)</tspan></text>
    
    <!-- Meta Table -->
    <rect x="0" y="60" width="470" height="240" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <g font-family="sans-serif" font-size="12" fill="#94a3b8" transform="translate(20, 25)">
      <text x="0" y="15">Material Composition:</text>
      <text x="200" y="15" fill="#f8fafc" font-weight="600">80% Organic Bio-Silk, 20% French Flax</text>
      
      <text x="0" y="45">GOTS Certification ID:</text>
      <text x="200" y="45" fill="#34d399" font-family="monospace">GOTS-FR-2026-99214</text>
      
      <text x="0" y="75">Cryptographic Chip Hash:</text>
      <text x="200" y="75" fill="#38bdf8" font-family="monospace">0x4b1a8d...f92e (SHA-256)</text>

      <text x="0" y="105">Circular Lifecycle State:</text>
      <text x="200" y="105" fill="#fbbf24" font-weight="700">FirstLife (Active Atelier Ownership)</text>
      
      <text x="0" y="135">Secondary Royalty Fee:</text>
      <text x="200" y="135" fill="#f8fafc">500 bps (5.00% on transfer)</text>

      <text x="0" y="165">Soroban Rent Status:</text>
      <text x="200" y="165" fill="#34d399">Auto-bumped (Protocol 22 TTL Active)</text>
      
      <text x="0" y="195">Current Owner Address:</text>
      <text x="200" y="195" fill="#e2e8f0" font-family="monospace">GBTYMGFX...TESTADDRESS (56-char)</text>
    </g>

    <!-- Transfer Action -->
    <rect x="0" y="315" width="220" height="42" rx="8" fill="url(#goldGrad)"/>
    <text x="110" y="341" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Transfer Ownership</text>

    <rect x="235" y="315" width="235" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="352" y="341" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Verify Soulbound History</text>
  </g>
</svg>